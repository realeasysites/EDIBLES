<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Edibles Dashboard</title><link rel="icon" href="/images/favicon.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10141f;font:17px/1.5 Georgia,serif;padding:20px}
form{background:#f6f0e7;padding:34px;width:min(360px,100%);text-align:center}
img{width:110px;margin:0 auto 18px;display:block}
input{width:100%;box-sizing:border-box;padding:13px;font:inherit;border:1px solid #b9ac9a;margin-bottom:12px}
button{width:100%;padding:14px;background:#8a1f52;color:#fff;border:0;font:inherit;cursor:pointer}
p{color:#a11b2d;min-height:1.5em;margin:10px 0 0;font-size:15px}
</style></head><body>
<form id="f"><img src="/images/logo-coaster.png" alt="Edibles">
<input type="password" name="password" placeholder="Password" aria-label="Password" autofocus required>
<button>Sign in</button><p role="status" id="m"></p></form>
<script>
document.getElementById('f').addEventListener('submit',async function(e){e.preventDefault();
var r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:this.password.value})});
if(r.ok)location.reload();else document.getElementById('m').textContent=(await r.json()).error;});
</script></body></html>
