<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Edibles Dashboard</title><link rel="icon" href="/images/favicon.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e7;color:#10141f;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#10141f;color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}
header img{width:42px}header b{font-size:18px;margin-right:auto}
nav{display:flex;gap:4px;background:#171e30;padding:0 14px;overflow-x:auto}
nav button{background:none;border:0;color:#cfc8bd;padding:13px 16px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-color:#e5a3bf}
main{max-width:980px;margin:0 auto;padding:22px 16px 80px}
h2{margin:0 0 6px;font-size:21px}.hint{color:#655c52;margin:0 0 16px;font-size:15px}
.card{background:#fff;border:1px solid #d9ccb9;border-radius:6px;padding:16px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top b{font-size:17px}.meta{color:#655c52;font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:10px}
input,select,textarea{display:block;width:100%;padding:9px;border:1px solid #b9ac9a;border-radius:4px;font:inherit;margin-top:3px;background:#fff}
select.status{width:auto;display:inline-block;margin:0}
.btn{background:#8a1f52;color:#fff;border:0;border-radius:4px;padding:9px 14px;font:inherit;cursor:pointer}
.btn.alt{background:#fff;color:#10141f;border:1px solid #b9ac9a}.btn.del{background:#fff;color:#a11b2d;border:1px solid #d6a5ad}
.row{display:grid;grid-template-columns:2fr 1fr;gap:10px}.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
h3{margin:22px 0 8px;font-size:16px;color:#8a1f52}
.grid{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;align-items:center}.grid span{font-weight:600;font-size:14px}.grid input{margin:0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#10141f;color:#fff;padding:10px 18px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.show{opacity:1}
.empty{color:#655c52;padding:30px;text-align:center}
.check{display:flex;gap:8px;align-items:center}.check input{width:auto;margin:0}
@media(max-width:560px){.row{grid-template-columns:1fr}}
</style></head><body>
<header><img src="/images/logo-coaster.png" alt=""><b>Edibles Dashboard</b>
<a href="/" target="_blank" style="color:#e5a3bf">View site</a><button class="btn alt" id="out">Sign out</button></header>
<nav id="tabs">
<button data-t="inq" class="on">Event inquiries</button><button data-t="menu">Menus</button><button data-t="feat">Features</button><button data-t="set">Links &amp; hours</button>
</nav>
<main id="view"></main><div id="toast" role="status"></div>
<script src="/js/admin.js?v=2"></script>
</body></html>
